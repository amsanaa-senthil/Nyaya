name: CI Pipeline

on:
  push:
    branches: [ main, Database, development ]
  pull_request:
    branches: [ main, Database, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]

    env:
      NYAYA_DISABLE_GRAPH: "1"
      HUGGINGFACE_MODEL_NAME: ""

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-cov flake8 pylint

    - name: Debug Python environment
      run: |
        python --version
        python -m pip --version
        python -m pip show pytest || true
        python -m pip show pytest-cov || true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        python -m flake8 agent pipeline tests app.py main.py query.py evaluate.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        python -m flake8 agent pipeline tests app.py main.py query.py evaluate.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v \
          --ignore=tests/test_hybrid.py \
          --ignore=tests/test_retrieval_only.py \
          --ignore=tests/test_case_router.py

    - name: Upload coverage to Codecov
      if: always() && hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Check core imports
      run: |
        python -c "import agent.nyaya_agent as n; import agent.retriever as r; print('[OK] Core modules import successfully')"
