name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/nyaya:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/nyaya:latest

    - name: Trigger Render deploy hook
      if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
      run: |
        curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

    - name: Deployment status note
      if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
      run: |
        echo "No RENDER_DEPLOY_HOOK_URL secret configured."
        echo "Image was built and pushed to GHCR successfully."
